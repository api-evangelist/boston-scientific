  integration-solutions page at cdx.bostonscientific.com. Every entry below quotes the
  provider's own text; nothing is inferred from product marketing.
note: >-
  Boston Scientific publishes no OpenAPI, AsyncAPI, GraphQL SDL or WSDL, so none of the
